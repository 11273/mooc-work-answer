name: 多平台构建

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: true
      - name: Install locked build dependencies
        run: uv sync --locked --group build
      - name: Set build version
        shell: bash
        run: |
          uv run --frozen --group build python - <<'PY'
          import os
          version = os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF'].startswith('refs/tags/v') else 'verify-' + os.environ['GITHUB_SHA'][:12]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('TAG_NAME=' + version + '\n')
          print('Build version:', version)
          PY
      - name: Run regression tests
        run: uv run --frozen --group build python -m unittest discover -s tests -v
      - name: Build and run executable self-test
        shell: bash
        env:
          MOOC_PLATFORM: ${{ matrix.platform }}
          MOOC_ARCH: ${{ matrix.arch }}
        run: uv run --frozen --group build python .github/scripts/build_package.py --version "$TAG_NAME" --platform "$MOOC_PLATFORM" --arch "$MOOC_ARCH"
      - name: Upload executable and verification report
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: '*.log'
          if-no-files-found: ignore
          retention-days: 3

  verify:
    name: Verify downloaded artifacts
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: verified-files
          merge-multiple: true
      - name: Verify checksums, platforms, and runtime versions
        shell: bash
        run: |
          VERSION="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            VERSION="verify-${GITHUB_SHA:0:12}"
          fi
          uv run --frozen python .github/scripts/verify_artifacts.py verified-files --version "$VERSION"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: release-files
          merge-multiple: true
      - name: Restore executable permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('release-files').iterdir():
              if path.suffix not in ('.exe', '.json', '.sha256'):
                  path.chmod(path.stat().st_mode | 0o111)
          PY
      - name: Generate release notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          bash .github/scripts/generate-release-notes.sh "$TAG_NAME" changelog.txt "$PREV_TAG"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: '🚀 Release ${{ github.ref_name }}'
          body_path: changelog.txt
          files: release-files/*
          draft: false
          prerelease: false
          make_latest: true
