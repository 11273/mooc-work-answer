name: 多平台构建

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            ext: .exe
            name: Windows
            icon: 🪟
          - os: macos-latest
            platform: macos
            arch: x64
            ext: ""
            name: macOS
            icon: 🍎
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: ""
            name: Linux
            icon: 🐧

    steps:
      - name: ${{ matrix.icon }} 检出代码 (${{ matrix.name }})
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: 获取版本信息
        shell: bash
        run: |
          echo "TAG_NAME=${{github.ref_name}}" >> $GITHUB_ENV
          if git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            echo "PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)" >> $GITHUB_ENV
          else
            echo "PREV_TAG=" >> $GITHUB_ENV
          fi

      - name: 注入环境变量 (Spec文件)
        if: matrix.platform == 'windows'
        uses: NicoG60/simple-template-renderer@v1
        with:
          input: StartWorkLite.spec
        env:
          PYINSTALL_KEY: ${{ secrets.PYINSTALL_KEY }}
          TAG_NAME: ${{ env.TAG_NAME }}

      - name: 注入环境变量 (Python文件)
        uses: NicoG60/simple-template-renderer@v1
        with:
          input: StartWork.py
        env:
          TAG_NAME: ${{ env.TAG_NAME }}

      - name: ${{ matrix.icon }} 显示构建信息 (${{ matrix.name }})
        shell: bash
        run: |
          echo "======================================"
          echo "${{ matrix.icon }} 构建信息 - ${{ matrix.name }}"
          echo "======================================"
          echo "平台: ${{ matrix.platform }}"
          echo "架构: ${{ matrix.arch }}"
          echo "运行器: ${{ matrix.os }}"
          echo "上一版本: ${{ env.PREV_TAG }}"
          echo "当前版本: ${{ env.TAG_NAME }}"
          echo "======================================"

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"

      - name: 安装系统依赖 (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: 安装构建依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # 使用更新的 PyInstaller 版本解决 macOS 代码签名问题
          if [ "${{ matrix.platform }}" = "macos" ]; then
            pip install pyinstaller==5.13.2
          else
            pip install pyinstaller==4.5
          fi
          pip install wheel
          pip install tinyaes
          pip install -r requirements.txt

      - name: ${{ matrix.icon }} 构建可执行文件 (${{ matrix.name }})
        shell: bash
        run: |
          echo "🔨 开始构建 ${{ matrix.name }} 可执行文件..."
          
          if [ "${{ matrix.platform }}" = "windows" ]; then
            pyinstaller StartWorkLite.spec
          else
            # Linux 构建
            pyinstaller --onefile \
              --name "MoocWorkAnswer-${{ env.TAG_NAME }}-lite-${{ matrix.platform }}" \
              --distpath dist \
              --workpath build \
              --specpath . \
              --console \
              StartWork.py
          fi
          
          echo "✅ ${{ matrix.name }} 构建完成"

      - name: 验证构建结果
        shell: bash
        run: |
          if ls dist/* 1> /dev/null 2>&1; then
            echo "✅ ${{ matrix.name }} 构建文件生成成功"
            ls -la dist/
          else
            echo "❌ ${{ matrix.name }} 构建文件生成失败"
            exit 1
          fi

      - name: 重命名输出文件并设置权限
        shell: bash
        run: |
          cd dist
          for file in *; do
            if [ -f "$file" ]; then
              # 获取文件扩展名
              if [ "${{ matrix.platform }}" = "windows" ]; then
                ext=".exe"
              else
                ext=""
              fi
              
              # 统一文件名格式
              new_name="MoocWorkAnswer-${{ env.TAG_NAME }}-lite-${{ matrix.platform }}${ext}"
              
              # 检查文件名是否已经是目标名称
              if [ "$file" != "$new_name" ]; then
                mv "$file" "$new_name"
                echo "✅ 文件重命名: $file -> $new_name"
              else
                echo "ℹ️ 文件名已正确，跳过重命名: $file"
              fi
              
              # 为 macOS 和 Linux 设置执行权限和文件属性
              if [ "${{ matrix.platform }}" != "windows" ]; then
                chmod +x "$new_name"
                echo "✅ 已设置执行权限: $new_name"
                
                # macOS 特殊处理：设置文件类型
                if [ "${{ matrix.platform }}" = "macos" ]; then
                  # 确保文件被识别为 Unix 可执行文件
                  file "$new_name"
                  ls -la "$new_name"
                fi
              fi
            fi
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1
          # 尝试保持文件权限
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          mkdir -p release-files
          find artifacts -name "*" -type f -exec cp {} release-files/ \;
          
          # 确保 macOS 和 Linux 文件有执行权限
          cd release-files
          for file in *; do
            if [[ "$file" != *.exe ]]; then
              chmod +x "$file"
              echo "✅ 设置执行权限: $file"
              
              # 检查 macOS 文件
              if [[ "$file" == *"macos"* ]]; then
                echo "🍎 macOS 文件信息:"
                file "$file" || echo "file 命令不可用"
                ls -la "$file"
              fi
            fi
          done
          
          echo "📦 所有发布文件:"
          ls -la

      - name: 获取更新日志
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          bash .github/scripts/generate-release-notes.sh \
            "${TAG_NAME}" \
            changelog.txt \
            "${PREV_TAG}"
          cat changelog.txt

      - name: 🚀 创建多平台发布
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Release ${{github.ref_name}}"
          body_path: changelog.txt
          files: |
            release-files/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

