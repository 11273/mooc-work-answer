name: Python regression tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12.16', '3.13.18']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Audit locked runtime dependencies
        if: matrix.python-version == '3.12.16'
        run: uvx --python 3.12.16 --from pip-audit==2.10.1 pip-audit --path .venv/lib/python3.12/site-packages
